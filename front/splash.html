<!doctype html>
<html><body style="font-family:system-ui;padding:24px">
<pre id="out">checking…</pre>
<script>
(async () => {
  const info = {
    href: location.href,
    origin: location.origin,
    windowBridge: typeof window.windowBridge,
    electron: typeof window.electron,
    bridgeMethodCount: window.windowBridge ? Object.keys(window.windowBridge).length : 0,
    downloadLocation: null,
  };
  try { info.downloadLocation = await window.windowBridge.currentDownloadLocation(); }
  catch (e) { info.downloadLocation = 'call failed: ' + e.message; }
  document.getElementById('out').textContent = JSON.stringify(info, null, 2);
})();
</script>
</body></html>
